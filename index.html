<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Project Bharti is an IIT Delhi research and outreach initiative on financial literacy, digital literacy, and women entrepreneurship." />
    <meta name="theme-color" content="#7f1d1d" />
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="Project Bharti" />
    <meta property="og:title" content="Project Bharti | IIT Delhi" />
    <meta property="og:description" content="Project Bharti is an IIT Delhi research and outreach initiative on financial literacy, digital literacy, and women entrepreneurship." />
    <meta property="twitter:card" content="summary_large_image" />
    <meta property="twitter:title" content="Project Bharti | IIT Delhi" />
    <meta property="twitter:description" content="Project Bharti is an IIT Delhi research and outreach initiative on financial literacy, digital literacy, and women entrepreneurship." />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>Project Bharti | IIT Delhi</title>
  </head>
  <body>
    <div id="root"></div>
    <!-- Early media buffer via a real <video> element (Chromium ignores as="video" link preload). -->
    <video
      id="project-bharti-intro-preload"
      muted
      playsinline
      preload="auto"
      aria-hidden="true"
      tabindex="-1"
      style="position:fixed;width:1px;height:1px;opacity:0;pointer-events:none;left:-9999px;top:0"
    ></video>
    <script>
      (function () {
        try {
          if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
          if (navigator.connection && navigator.connection.saveData) return;
          if (window.sessionStorage.getItem('project-bharti-opening-intro-played') === 'true') return;

          var poster = new Image();
          poster.fetchPriority = 'high';
          poster.src = '/videos/project-bharti-opening-poster.jpg';

          var video = document.getElementById('project-bharti-intro-preload');
          if (!video) return;
          video.src = '/videos/project-bharti-opening.mp4';
          video.load();
        } catch (error) {
          // Intro preload must never block page startup.
        }
      })();
    </script>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
